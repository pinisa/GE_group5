<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Kanit', sans-serif; } 
        
        /* CSS สำหรับจัดโครงสร้างผังที่นั่งชั้น 1 */
        .food-court-layout {
            display: grid;
            grid-template-areas:
                "left-zone food-zone right-zone"
                "left-zone main-seat right-zone"
                "left-zone row-e     row-e"
                "left-zone bottom-zone bottom-zone";
            grid-template-columns: 110px 1fr 60px;
            grid-template-rows: auto auto auto auto;
            gap: 16px;
            min-width: 850px;
            background-color: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
        }

        /* CSS สำหรับชั้นใต้ดิน ปรับ width ให้ fit-content ป้องกันของทะลุกรอบ */
        .lower-layout {
            display: grid;
            grid-template-columns: 80px auto 80px;
            gap: 16px;
            min-width: 860px;
            width: fit-content;
            margin: 0 auto;
            background-color: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
        }

        .main-seat-grid {
            grid-area: main-seat;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 65px);
            gap: 16px;
            padding: 16px 0 0 0;
            justify-items: center;
            align-items: center;
        }

        .row-e-grid {
            grid-area: row-e;
            display: grid;
            grid-template-columns: repeat(9, 65px);
            justify-content: end; 
            gap: 14px;
            padding: 16px 0;
        }

        /* Grid พิเศษสำหรับชั้นใต้ดิน (2-4-2 พร้อมช่องเสา) */
        .lower-seat-grid {
            display: grid;
            grid-template-columns: repeat(2, 65px) 24px repeat(4, 65px) 24px repeat(2, 65px);
            /* เพิ่มแถวเว้นระยะ 30px ก่อนถึงแถวสุดท้ายที่ปรับให้เล็กลงเหลือ 45px */
            grid-template-rows: repeat(4, 65px) 30px 45px; 
            gap: 12px;
            justify-items: center;
            align-items: center;
        }

        .tbl { 
            width: 100%; 
            max-width: 65px; 
            height: 48px;
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 14px; 
            font-weight: bold; 
            transition: all 0.2s;
        }
    </style>
</head>
