<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชำระเงิน - KKU Canteen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20 md:pb-8">

    <!-- Header Navigation -->
    <header class="bg-red-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white text-red-800 rounded-xl flex items-center justify-center font-bold text-lg shadow">KKU</div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold leading-tight">KKU Canteen</h1>
                    <p class="text-[11px] md:text-xs text-red-200">ชำระเงินสั่งอาหารล่วงหน้า</p>
                </div>
            </div>

            <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="index.html" class="text-red-200 hover:text-white transition flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    จองโต๊ะ
                </a>
                <a href="preorder.html" class="text-red-200 hover:text-white transition flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    สั่งอาหาร
                </a>
                <a href="booking.html" class="text-red-200 hover:text-white transition flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5h14a2 2 0 012 2v3a2 2 0 01-2 2H5a2 2 0 01-2-2v-3a2 2 0 000-4V7a2 2 0 012-2z"/></svg>
                    ตั๋วของฉัน
                </a>
                <a href="history.html" class="text-red-200 hover:text-white transition flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    ประวัติ
                </a>
            </nav>

            <div class="bg-red-900/70 px-3 py-1.5 rounded-full text-xs flex items-center gap-2 border border-red-700/60 shadow-inner">
                <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
                <span id="user-display-name" class="font-medium">กำลังโหลด...</span>
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto p-4 md:p-6 mt-4">
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200 text-center space-y-5 p-6">
            
            <div class="bg-blue-900 text-white py-3 rounded-2xl flex items-center justify-center gap-2 font-bold text-sm">
                <span></span> PromptPay (พร้อมเพย์)
            </div>

            <div>
                <span class="text-xs text-slate-400">ยอดชำระสุทธิ</span>
                <h2 id="pay-total-amount" class="text-3xl font-extrabold text-slate-800 mt-0.5">0 บาท</h2>
            </div>

            <!-- QR Code PromptPay Mockup -->
            <div class="bg-slate-50 border-2 border-dashed border-slate-300 p-4 rounded-2xl inline-block mx-auto relative">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PROMPTPAY_KKU_CANTEEN" alt="PromptPay QR Code" class="w-44 h-44 mx-auto rounded-lg">
                <span class="text-[11px] text-slate-500 mt-2 block font-medium">สแกนผ่าน Mobile Banking ได้ทุกธนาคาร</span>
            </div>

            <div class="bg-amber-50 text-amber-700 p-3 rounded-xl text-xs flex items-center justify-center gap-2 border border-amber-200">
                <span class="animate-pulse"></span> กรุณาชำระภายใน <b id="countdown">14:59</b> นาที
            </div>

            <div class="pt-2 space-y-2">
                <button onclick="confirmPayment()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> จำลอง: ชำระเงินเรียบร้อยแล้ว
                </button>

                <a href="preorder.html" class="block w-full text-slate-400 hover:text-slate-600 text-xs py-2">
                    ย้อนกลับไปแก้ไขรายการสั่งอาหาร
                </a>
            </div>

        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const total = localStorage.getItem('total_price') || '0';
            const savedEmail = localStorage.getItem('kku_user_email') || 'sasiwitra@kkumail.com';
            
            document.getElementById('pay-total-amount').innerText = `${total} บาท`;
            document.getElementById('user-display-name').innerText = savedEmail.split('@')[0];
            
            startTimer(15 * 60);
        });

        function confirmPayment() {
            localStorage.setItem('payment_status', 'paid');
            // ชำระเงินเสร็จสิ้น ส่งต่อไปยังหน้าตั๋วการจอง (booking.html)
            window.location.href = 'booking.html';
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                document.getElementById('countdown').textContent = minutes + ":" + seconds;
                if (--timer < 0) timer = duration;
            }, 1000);
        }
    </script>
</body>
</html>
